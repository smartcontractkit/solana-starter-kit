[package]
name = "ccip-sender-v2"
version = "0.1.0"
description = "CCIP 2.0 sender program with staged account resolution"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "ccip_sender_v2"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "ccip_common/idl-build", "ccip_router/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
ccip_common = { git = "https://github.com/smartcontractkit/chainlink-ccip-solana.git", tag = "contracts/v2.1.0", features = ["no-entrypoint"] }
ccip_router = { git = "https://github.com/smartcontractkit/chainlink-ccip-solana.git", tag = "contracts/v2.1.0", features = ["no-entrypoint"] }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("anchor-debug", "custom-panic", "custom-heap", "no-idl", "no-log-ix-name"))',
]
